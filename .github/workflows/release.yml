name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: go.sum

      - name: Set up release tools
        env:
          GOBIN: ${{ runner.temp }}/rc-release-tools
        run: |
          python3 -m venv "$RUNNER_TEMP/rc-release-python"
          "$RUNNER_TEMP/rc-release-python/bin/python" -m pip install --disable-pip-version-check PyYAML==6.0.3
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Build release assets
        env:
          GOTOOLCHAIN: local
          GOWORK: 'off'
          GOFLAGS: -mod=readonly
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          "$RUNNER_TEMP/rc-release-python/bin/python" scripts/release-package.py \
            --version "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --output dist/release

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/release/* \
            --verify-tag --title "rc-cli $GITHUB_REF_NAME" --generate-notes

  notify-homebrew:
    needs: release
    runs-on: ubuntu-24.04
    environment: package-distribution
    permissions:
      contents: none
    steps:
      - name: Trigger Homebrew formula update
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.HOMEBREW_REPO_DISPATCH_TOKEN }}
          repository: runtimeconditions/homebrew-tools
          event-type: rc-cli-release-published
          client-payload: '{"tag":"${{ github.ref_name }}"}'

  notify-linux-packages:
    needs: release
    runs-on: ubuntu-24.04
    environment: package-distribution
    permissions:
      contents: none
    steps:
      - name: Trigger apt and yum repository publication
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.HOMEBREW_REPO_DISPATCH_TOKEN }}
          repository: runtimeconditions/packages
          event-type: rc-cli-release-published
          client-payload: '{"tag":"${{ github.ref_name }}"}'
